name: Close pull requests

# We're not accepting code contributions yet. This never checks out PR code.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: >-
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comment and close
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "$MESSAGE"
          gh pr close "$PR" --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MESSAGE: >-
            Thanks for this! We're not accepting code contributions yet, so pull requests
            are closed automatically. We plan to publish Warden's core here. To propose a
            change, open a feature request with a Warden spec: see CONTRIBUTING.md.
