name: Feature request check

# Validates that a feature request carries a Warden spec or plan export.
# The issue body is only ever read by the script via the event payload, never
# interpolated into a shell command.
on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: feature-request-check-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'feature-request') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check attached spec or plan
        run: node .github/scripts/check-artifact.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
